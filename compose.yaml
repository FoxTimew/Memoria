name: memoria
services:
  file-converter:
    init: true
    build: ./infra/file-validator
    image: memoria-file-validator:7d
    network_mode: none
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    tmpfs:
      - /scratch:rw,noexec,nosuid,size=12m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
    volumes:
      - ${FILES_VALIDATOR_DIRECTORY:-./.local/file-exchange}:/exchange
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memoria}
      POSTGRES_DB: ${POSTGRES_DB:-memoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Run pnpm env:init}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Run pnpm env:init}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports: ['127.0.0.1:9000:9000']
    volumes: [rustfs-data:/data]
  minio:
    profiles: [conformance]
    build: ./infra/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memoria-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm env:init}
    ports: ['127.0.0.1:19001:9000', '127.0.0.1:19002:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  caddy:
    image: caddy:2-alpine
    ports: ['127.0.0.1:80:80', '127.0.0.1:443:443', '127.0.0.1:9443:9443']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  postgres-data:
  minio-data:
  rustfs-data:
  caddy-data:
  caddy-config:
